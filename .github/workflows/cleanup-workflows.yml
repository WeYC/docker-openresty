name: Cleanup Workflow Runs

on:
  workflow_dispatch:
    inputs:
      delete_failed:
        description: 'Delete failed runs'
        required: true
        default: true
        type: boolean
      delete_cancelled:
        description: 'Delete cancelled runs'
        required: true
        default: true
        type: boolean
      delete_skipped:
        description: 'Delete skipped runs'
        required: true
        default: true
        type: boolean
      days_to_keep:
        description: 'Keep runs newer than N days (0 = delete all)'
        required: true
        default: 0
        type: number

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DELETE_FAILED: ${{ github.event.inputs.delete_failed }}
          DELETE_CANCELLED: ${{ github.event.inputs.delete_cancelled }}
          DELETE_SKIPPED: ${{ github.event.inputs.delete_skipped }}
          DAYS_TO_KEEP: ${{ github.event.inputs.days_to_keep }}
        run: |
          set -e

          build_status_filter=""
          if [ "$DELETE_FAILED" = "true" ]; then
            build_status_filter="${build_status_filter} failure"
          fi
          if [ "$DELETE_CANCELLED" = "true" ]; then
            build_status_filter="${build_status_filter} cancelled"
          fi
          if [ "$DELETE_SKIPPED" = "true" ]; then
            build_status_filter="${build_status_filter} skipped"
          fi

          if [ -z "$build_status_filter" ]; then
            echo "No status selected for deletion. Exiting."
            exit 0
          fi

          if [ "$DAYS_TO_KEEP" -gt 0 ]; then
            cutoff_date=$(date -d "$DAYS_TO_KEEP days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Will delete runs older than $cutoff_date"
          else
            cutoff_date=""
            echo "Will delete all matching runs"
          fi

          for status in $build_status_filter; do
            echo ""
            echo "=== Processing status: $status ==="

            page=1
            while true; do
              response=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/$REPO/actions/runs?status=$status&per_page=100&page=$page")

              run_count=$(echo "$response" | jq '.workflow_runs | length')
              if [ "$run_count" -eq 0 ]; then
                echo "No more $status runs found."
                break
              fi

              echo "Found $run_count $status runs on page $page"

              ids=$(echo "$response" | jq -r '.workflow_runs[] | select(.name != "Cleanup Workflow Runs") | [.id, .created_at] | @tsv')

              if [ -z "$ids" ]; then
                echo "No deletable runs on this page."
                page=$((page + 1))
                continue
              fi

              echo "$ids" | while IFS=$'\t' read -r run_id created_at; do
                if [ -n "$cutoff_date" ] && [ "$created_at" \> "$cutoff_date" ]; then
                  echo "Skipping run $run_id (created $created_at, newer than cutoff)"
                  continue
                fi

                echo "Deleting run $run_id (created $created_at, status=$status)"
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "/repos/$REPO/actions/runs/$run_id" || echo "Failed to delete run $run_id"
              done

              page=$((page + 1))
            done
          done

          echo ""
          echo "Cleanup completed."