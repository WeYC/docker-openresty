name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "1Panel version, e.g. 1.27.1.2-5-1-focal"
        required: true
        default: "1.27.1.2-5-1-focal"
        type: string
  workflow_call:
    inputs:
      VERSION:
        description: "1Panel version, e.g. 1.27.1.2-5-1-focal"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment variables
        id: version
        run: |
          VERSION="${{ inputs.VERSION }}"
          RESTY_VERSION=$(echo "$VERSION" | cut -d'-' -f1)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RESTY_VERSION=${RESTY_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout 1Panel-dev appstore
        uses: actions/checkout@v7
        with:
          repository: 1Panel-dev/appstore
          ref: dev
          path: appstore
          sparse-checkout: |
            apps/openresty/${{ env.VERSION }}/build/tmp
          sparse-checkout-cone-mode: false

      - name: Copy tmp into build context
        run: |
          mkdir -p tmp
          cp -a "appstore/apps/openresty/${{ env.VERSION }}/build/tmp/." tmp/
          ls -la tmp | head -30

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.VERSION }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          build-args: |
            RESTY_VERSION=${{ env.RESTY_VERSION }}
            RESTY_EVAL_PRE_CONFIGURE=export CFLAGS="-mfpu=vfpv3-d16 -mfloat-abi=hard"
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.VERSION }}
          cache-from: type=gha,scope=${{ env.VERSION }}
          cache-to: type=gha,scope=${{ env.VERSION }},mode=max