name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version (e.g. 1.27.1.2-5-1-focal, 1.21.4.3-3-3-focal)'
        required: true
        default: '1.27.1.2-5-1-focal'
        type: choice
        options:
          - '1.27.1.2-5-1-focal'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version
        id: version
        run: |
          VERSION="${{ github.event.inputs.VERSION }}"
          IFS='-' read -r RESTY_VERSION DOCKER_BUILD PANEL_BUILD DISTRO <<< "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "RESTY_VERSION=${RESTY_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ github.event.inputs.VERSION }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          build-args: |
            RESTY_VERSION=${{ steps.version.outputs.RESTY_VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ github.event.inputs.VERSION }}
          cache-from: type=gha,scope=${{ github.event.inputs.VERSION }}
          cache-to: type=gha,scope=${{ github.event.inputs.VERSION }},mode=max
