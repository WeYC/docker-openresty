name: Build Base Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment variables
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OPENRESTY_VERSION=$(echo "$VERSION" | cut -d'-' -f1,2)
          echo "OPENRESTY_VERSION=${OPENRESTY_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout openresty/docker-openresty
        uses: actions/checkout@v7
        with:
          repository: openresty/docker-openresty
          ref: ${{ env.OPENRESTY_VERSION }}
          path: upstream

      - name: Checkout 1Panel-dev Appstore
        uses: actions/checkout@v7
        with:
          repository: 1Panel-dev/appstore
          path: appstore
          sparse-checkout: |
            apps/openresty/${{ env.VERSION }}

      - name: Copy dependencies to upstream
        run: |
          VERSION="${{ inputs.version }}"
          SRC="appstore/apps/openresty/${VERSION}"
          [ -d "${SRC}/1pwaf" ] && cp -r "${SRC}/1pwaf" upstream/
          [ -d "${SRC}/build/tmp" ] && cp -r "${SRC}/build/tmp" upstream/
          [ -d "${SRC}/build/nginx.conf" ] && cp "${SRC}/build/nginx.conf" upstream/
          [ -d "${SRC}/build/nginx.vh.default.conf" ] && cp "${SRC}/build/nginx.vh.default.conf" upstream/
          ls -la upstream/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: upstream
          file: upstream/focal/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            weycovo/openresty:${{ env.VERSION }}
          cache-from: type=gha,scope=base-${{ env.VERSION }}
          cache-to: type=gha,scope=base-${{ env.VERSION }},mode=max