name: Build Seed Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.version }}
          file: ./${{ inputs.version }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            weycovo/openresty:${{ inputs.version }}
          build-args: |
            PANEL_OPENRESTY_VERSION=${{ steps.parse.outputs.inputs.version }}
          cache-from: type=gha,scope=seed-${{ env.inputs.version }}
          cache-to: type=gha,scope=seed-${{ env.inputs.version }},mode=max
