name: Build Seed Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Parse version
        id: parse
        run: |
          VERSION="${{ inputs.version }}"
          IFS='-' read -r RESTY_VERSION DOCKER_BUILD PANEL_BUILD DISTRO <<< "${VERSION}"
          echo "RESTY_VERSION=${RESTY_VERSION}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone appstore and prepare build context
        run: |
          VERSION="${{ inputs.version }}"
          APPSTORE_DIR="appstore"
          BUILD_DIR="${APPSTORE_DIR}/apps/openresty/${VERSION}/build"

          git clone --depth 1 https://github.com/1Panel-dev/appstore.git "${APPSTORE_DIR}"

          if [ -d "${BUILD_DIR}" ]; then
            cp "${VERSION}/Dockerfile" "${BUILD_DIR}/Dockerfile"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push seed image
        uses: docker/build-push-action@v6
        with:
          context: ./appstore/apps/openresty/${{ inputs.version }}/build
          file: ./appstore/apps/openresty/${{ inputs.version }}/build/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            weycovo/openresty:${{ inputs.version }}
          build-args: |
            PANEL_OPENRESTY_VERSION=${{ steps.parse.outputs.RESTY_VERSION }}
          cache-from: type=gha,scope=seed-${{ inputs.version }}
          cache-to: type=gha,scope=seed-${{ inputs.version }},mode=max
