name: Build via Official 1Panel Dockerfile

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'OpenResty version'
        required: true
        default: '1.27.1.2-5-1-focal'
        type: choice
        options:
          - '1.27.1.2-5-1-focal'
          - '1.21.4.3-3-3-focal'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone official appstore
        run: |
          git clone --depth 1 -b dev \
            https://github.com/1Panel-dev/appstore.git /tmp/appstore

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build armv7
        uses: docker/build-push-action@v6
        with:
          context: /tmp/appstore/apps/openresty/${{ github.event.inputs.VERSION }}/build
          file: /tmp/appstore/apps/openresty/${{ github.event.inputs.VERSION }}/build/Dockerfile
          platforms: linux/arm/v7
          push: false
          build-args: |
            PANEL_OPENRESTY_VERSION=${{ github.event.inputs.VERSION }}
          tags: openresty:${{ github.event.inputs.VERSION }}-official-test
