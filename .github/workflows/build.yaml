name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'OpenResty version (e.g. 1.31.1.1)'
        required: true
        default: ''
      SUFFIX:
        description: 'Tag suffix (e.g. 2-4-noble)'
        required: true
        default: ''

jobs:
  build:
    if: github.event.inputs.VERSION != '' && github.event.inputs.SUFFIX != ''
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.VERSION }}-${{ github.event.inputs.SUFFIX }}
    steps:
      - name: Checkout specific tag from external repository
        uses: actions/checkout@v4
        with:
          repository: 'openresty/docker-openresty'
          ref: 'refs/tags/${{ github.event.inputs.VERSION }}'

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./noble/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.TAG_NAME }}
          compress: true
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          provenance: false
          sbom: false
          allow: |
            network.max
          labels: |
            org.opencontainers.image.arch=arm64
            org.opencontainers.image.base.name=ubuntu
            org.opencontainers.image.source=openresty/docker-openresty
            org.opencontainers.image.revision=${{ github.event.inputs.VERSION }}

