name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'OpenResty version (e.g. 1.31.1.1)'
        required: true
        default: ''
      FLAVOR:
        description: 'OpenResty Docker flavor number (e.g. 2)'
        required: true
        default: ''
      BUILD_NUMBER:
        description: '1Panel build number (e.g. 4)'
        required: true
        default: ''
      DISTRO:
        description: 'Target distro (e.g. noble)'
        required: true
        default: ''

jobs:
  build:
    if: github.event.inputs.VERSION != '' && github.event.inputs.FLAVOR != '' && github.event.inputs.BUILD_NUMBER != '' && github.event.inputs.DISTRO != ''
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.VERSION }}-${{ github.event.inputs.FLAVOR }}-${{ github.event.inputs.BUILD_NUMBER }}-${{ github.event.inputs.DISTRO }}
    steps:
      - name: Checkout specific tag from external repository
        uses: actions/checkout@v4
        with:
          repository: 'openresty/docker-openresty'
          ref: 'refs/tags/${{ github.event.inputs.VERSION }}-${{ github.event.inputs.FLAVOR }}'

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ github.event.inputs.DISTRO }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.TAG_NAME }}
          compress: true
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          provenance: false
          sbom: false
          allow: |
            network.host
          labels: |
            org.opencontainers.image.arch=arm
            org.opencontainers.image.base.name=ubuntu
            org.opencontainers.image.source=openresty/docker-openresty
            org.opencontainers.image.revision=${{ github.event.inputs.VERSION }}

