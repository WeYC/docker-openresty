name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yaml'
      - 'focal/Dockerfile'
      - 'nginx.conf'
      - 'default/**'
      - '1pwaf/**'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'OpenResty version (e.g. 1.27.1.2)'
        required: true
        default: '1.27.1.2'

jobs:
  build:
    if: github.event_name == 'push' || github.event.inputs.VERSION != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.VERSION || '1.27.1.2' }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./focal/Dockerfile
          build-args: |
            RESTY_VERSION=${{ env.VERSION }}
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.VERSION }}-5-1-focal
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
