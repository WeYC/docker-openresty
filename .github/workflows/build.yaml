name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yaml'
      - 'focal/Dockerfile'
      - 'nginx.conf'
      - 'default/**'
      - '1pwaf/**'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version (e.g. 1.27.1.2-5-1-focal)'
        required: true
        default: '1.27.1.2-5-1-focal'

jobs:
  build:
    if: github.event_name == 'push' || github.event.inputs.VERSION != ''
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}
    steps:
      - name: Parse version string
        run: |
          VERSION="${{ env.TAG_NAME }}"
          IFS='-' read -r RESTY_VERSION FLAVOR BUILD_NUMBER DISTRO <<< "$VERSION"
          echo "RESTY_VERSION=${RESTY_VERSION}" >> $GITHUB_ENV
          echo "DISTRO=${DISTRO}" >> $GITHUB_ENV

      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ env.DISTRO }}/Dockerfile
          build-args: |
            RESTY_VERSION=${{ env.RESTY_VERSION }}
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.TAG_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:latest
          cache-from: type=gha,scope=${{ env.DISTRO }}
          cache-to: type=gha,scope=${{ env.DISTRO }},mode=max