name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yaml'
      - 'focal/Dockerfile'
      - 'nginx.conf'
  workflow_dispatch:
    inputs:
      VERSION:
        description: '1Panel OpenResty version (e.g. 1.27.1.2-5-1-focal)'
        required: true
        default: '1.27.1.2-5-1-focal'

jobs:
  build:
    if: github.event_name == 'push' || github.event.inputs.VERSION != ''
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./focal/Dockerfile
          build-args: |
            PANEL_OPENRESTY_VERSION=${{ env.TAG_NAME }}
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.TAG_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max