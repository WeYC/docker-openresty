name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'OpenResty version'
        required: true
        default: '1.31.1.1'
      FLAVOR:
        description: 'OpenResty Docker flavor number'
        required: true
        default: '2'
      BUILD_NUMBER:
        description: '1Panel build number'
        required: true
        default: '4'
      DISTRO:
        description: 'Target distro'
        required: true
        default: 'noble'

jobs:
  build:
    if: github.event.inputs.VERSION != '' && github.event.inputs.FLAVOR != '' && github.event.inputs.BUILD_NUMBER != '' && github.event.inputs.DISTRO != ''
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.VERSION }}-${{ github.event.inputs.FLAVOR }}-${{ github.event.inputs.BUILD_NUMBER }}-${{ github.event.inputs.DISTRO }}
    steps:
      - name: Checkout specific tag from external repository
        uses: actions/checkout@v4
        with:
          repository: 'openresty/docker-openresty'
          ref: 'refs/tags/${{ github.event.inputs.VERSION }}-${{ github.event.inputs.FLAVOR }}'

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ github.event.inputs.DISTRO }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          pull: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.TAG_NAME }}
          target: runtime
          build-args: |
            RESTY_LUAJIT_OPTIONS=-DLUAJIT_NUMMODE=2 -DLUAJIT_ENABLE_LUA52COMPAT -mno-sse4.2
            RESTY_J=2
          compress: true
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          provenance: false
          sbom: false
          network: host
          allow: |
            network.host
          labels: |
            org.opencontainers.image.arch=arm
            org.opencontainers.image.base.name=ubuntu
            org.opencontainers.image.source=openresty/docker-openresty
            org.opencontainers.image.revision=${{ github.event.inputs.VERSION }}

