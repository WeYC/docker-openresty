name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yaml'
      - '**/Dockerfile'
      - 'nginx.conf'
      - 'default/**'
      - '1pwaf/**'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version (e.g. 1.27.1.2-5-1-focal, 1.21.4.3-3-3-focal)'
        required: true
        default: '1.27.1.2-5-1-focal'
        type: choice
        options:
          - '1.27.1.2-5-1-focal'
          - '1.21.4.3-3-3-focal'

jobs:
  build:
    if: github.event_name == 'push' || github.event.inputs.VERSION != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - '1.27.1.2-5-1-focal'
          - '1.21.4.3-3-3-focal'
      fail-fast: false
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Determine version to build
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.VERSION }}"
          else
            VERSION="${{ matrix.version }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          IFS='-' read -r RESTY_VERSION FLAVOR BUILD_NUMBER DISTRO <<< "${VERSION}"
          echo "RESTY_VERSION=${RESTY_VERSION}" >> $GITHUB_OUTPUT
          echo "DISTRO=${DISTRO}" >> $GITHUB_OUTPUT

          # Check if version-specific Dockerfile changed
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only HEAD~1 HEAD | grep -q "^${VERSION}/"; then
              echo "CHANGED=true" >> $GITHUB_OUTPUT
            else
              echo "CHANGED=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU for multi-platform builds
        if: steps.version.outputs.CHANGED == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.CHANGED == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Login to DockerHub
        if: steps.version.outputs.CHANGED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.CHANGED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ steps.version.outputs.VERSION }}/build/Dockerfile
          build-args: |
            RESTY_VERSION=${{ steps.version.outputs.RESTY_VERSION }}
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:latest
          cache-from: type=gha,scope=${{ steps.version.outputs.VERSION }}
          cache-to: type=gha,scope=${{ steps.version.outputs.VERSION }},mode=max
