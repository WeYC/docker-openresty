name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yaml'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'OpenResty version (e.g. 1.31.1.1)'
        required: true
        default: '1.31.1.1'
      FLAVOR:
        description: 'OpenResty Docker flavor number (e.g. 2)'
        required: true
        default: '2'
      BUILD_NUMBER:
        description: '1Panel build number (e.g. 4)'
        required: true
        default: '4'
      DISTRO:
        description: 'Target distro (e.g. noble)'
        required: true
        default: 'jammy'

jobs:
  build:
    if: github.event_name == 'push' || (github.event.inputs.VERSION != '' && github.event.inputs.FLAVOR != '' && github.event.inputs.BUILD_NUMBER != '' && github.event.inputs.DISTRO != '')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.VERSION || '1.31.1.1' }}
      FLAVOR: ${{ github.event.inputs.FLAVOR || '2' }}
      BUILD_NUMBER: ${{ github.event.inputs.BUILD_NUMBER || '4' }}
      DISTRO: ${{ github.event.inputs.DISTRO || 'jammy' }}
      TAG_NAME: ${{ github.event.inputs.VERSION || '1.31.1.1' }}-${{ github.event.inputs.FLAVOR || '2' }}-${{ github.event.inputs.BUILD_NUMBER || '4' }}-${{ github.event.inputs.DISTRO || 'jammy' }}
    steps:
      - name: Checkout specific tag from external repository
        uses: actions/checkout@v4
        with:
          repository: 'openresty/docker-openresty'
          ref: 'refs/tags/${{ env.VERSION }}-${{ env.FLAVOR }}'

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ env.DISTRO }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ env.TAG_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
