name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "1.*/Dockerfile"
  workflow_dispatch:
    inputs:
      VERSION:
        description: "1Panel version"
        required: true
        default: "1.27.1.2-5-1-focal"
        type: choice
        options:
          - "1.27.1.2-5-1-focal"

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment variables
        run: |
          OPENRESTY_VERSION=$(echo "${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}" | cut -d'-' -f1,2)
          echo "OPENRESTY_VERSION=${OPENRESTY_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout openresty/docker-openresty
        uses: actions/checkout@v7
        with:
          repository: openresty/docker-openresty
          ref: ${{ env.OPENRESTY_VERSION }}
          path: upstream

      - name: Checkout 1Panel-dev Appstore
        uses: actions/checkout@v7
        with:
          repository: 1Panel-dev/appstore
          path: appstore
          sparse-checkout: |
            apps/openresty/${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}

      - name: Copy dependencies to upstream
        run: |
          SRC="appstore/apps/openresty/${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}"
          [ -d "${SRC}/1pwaf" ] && cp -r "${SRC}/1pwaf" upstream/
          [ -d "${SRC}/build/tmp" ] && cp -r "${SRC}/build/tmp" upstream/
          [ -d "${SRC}/build/nginx.conf" ] && cp "${SRC}/build/nginx.conf" upstream/
          [ -d "${SRC}/build/nginx.vh.default.conf" ] && cp "${SRC}/build/nginx.vh.default.conf" upstream/
          ls -la upstream/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: upstream
          file: upstream/focal/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            weycovo/openresty:${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}
          cache-from: type=gha,scope=base-${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}
          cache-to: type=gha,scope=base-${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }},mode=max

  build-seed:
    needs: build-base
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment variables
        run: |
          OPENRESTY_VERSION=$(echo "${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}" | cut -d'-' -f1,2)
          echo "OPENRESTY_VERSION=${OPENRESTY_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout current repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push seed image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}
          file: ./${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            weycovo/openresty:${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}
          build-args: |
            PANEL_OPENRESTY_VERSION=${{ env.OPENRESTY_VERSION }}
          cache-from: type=gha,scope=seed-${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }}
          cache-to: type=gha,scope=seed-${{ github.event.inputs.VERSION || '1.27.1.2-5-1-focal' }},mode=max
