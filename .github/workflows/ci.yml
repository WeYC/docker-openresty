name: CI

# Orchestrator entrypoint: fan out one build per version, then cleanup.
# Manual trigger with comma-separated versions, e.g.
#   1.27.1.2-5-1-focal,1.31.1.1-2-4-noble

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      VERSIONS:
        description: "Comma-separated 1Panel versions"
        required: true
        default: "1.31.1.1-2-4-noble"
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - id: versions
        run: |
          VERSIONS="${{ inputs.VERSIONS }}"
          if [ -z "$VERSIONS" ]; then VERSIONS="1.31.1.1-2-4-noble"; fi
          MATRIX=$(echo "$VERSIONS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -s -c .)
          if [ "${MATRIX}" = "[]" ]; then echo "No versions provided"; exit 1; fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        VERSION: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      VERSION: ${{ matrix.VERSION }}
    secrets: inherit

  cleanup:
    needs: build
    if: always()
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit
