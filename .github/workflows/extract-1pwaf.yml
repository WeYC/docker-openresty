name: Extract 1pwaf

# Extract the real 1pwaf tree from the official 1panel/openresty image
# (amd64 is pulled natively on x86 runners, no QEMU needed) and publish
# it as a downloadable artifact for inspection.
#
# NOTE: extracted .so files are x86_64 binaries for REFERENCE ONLY and
# must NOT be baked into arm/v7 images. Only the *.lua tree is portable.

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "1Panel version, e.g. 1.31.1.1-2-4-noble"
        required: true
        default: "1.31.1.1-2-4-noble"
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract 1pwaf tree from official image
        run: |
          set -e
          IMAGE="1panel/openresty:${{ inputs.VERSION }}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker create --name 1pwaf-src --platform linux/amd64 "$IMAGE" /bin/true
          mkdir -p 1pwaf-real
          docker cp 1pwaf-src:/usr/local/openresty/1pwaf/. ./1pwaf-real/
          docker cp 1pwaf-src:/usr/local/openresty/luajit/lib/lua/5.1/lsqlite3.so ./1pwaf-real-lsqlite3.so
          docker cp 1pwaf-src:/usr/local/openresty/luajit/lib/lua/5.1/lfs.so ./1pwaf-real-lfs.so
          docker rm 1pwaf-src
          tar czf 1pwaf-real-${{ inputs.VERSION }}.tar.gz 1pwaf-real 1pwaf-real-lsqlite3.so 1pwaf-real-lfs.so
          tar tzf 1pwaf-real-${{ inputs.VERSION }}.tar.gz | head -n 40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1pwaf-real-${{ inputs.VERSION }}
          path: 1pwaf-real-${{ inputs.VERSION }}.tar.gz
          retention-days: 30
