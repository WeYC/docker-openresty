name: Retag Image

# One-off backup: copy a Hub tag reference without pulling/pushing layers.
# Example: src=1.31.1.1-2-4-noble dest=2026-09-20

on:
  workflow_dispatch:
    inputs:
      src:
        description: "Source tag to copy from"
        required: true
        default: "1.31.1.1-2-4-noble"
        type: string
      dest:
        description: "New backup tag to create"
        required: true
        default: "2026-09-20"
        type: string

jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create backup tag
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ inputs.dest }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/openresty:${{ inputs.src }}
